# Build + test on every push to main and every pull request.
#
# No credentials required: every dependency, the DemoViewer.NET extension SDK included, restores from
# nuget.org, so forks and outside contributors get a working build.
#
# Both platforms run the suites, publish acb Native AOT (a trim or AOT warning fails the build) and run the
# published binary end to end (.github/scripts/acb-smoke.sh). The system-test jobs then run it on throwaway
# "player PCs"; test/system/README.md says what each one checks.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools (nbgv)
        run: dotnet tool restore

      - name: Build (Release)
        run: dotnet build CS2OpenDev-ConfigManager.slnx -c Release

      # TUnit executables, so they run via `dotnet run`, not `dotnet test`.
      - name: Core tests
        run: dotnet run --project test/CS2OpenDev.ConfigManager.Core.Tests -c Release --no-build

      - name: acb tests
        if: runner.os == 'Windows'
        run: dotnet run --project test/CS2OpenDev.ConfigManager.Cli.Tests -c Release --no-build

      # On Linux the wizard's screen test needs a terminal (Terminal.Gui's driver waits on the one it starts in),
      # so the suite runs under script(1), which gives it one with a size.
      - name: acb tests (in a terminal)
        if: runner.os == 'Linux'
        run: script -qec "stty cols 120 rows 40; dotnet run --project test/CS2OpenDev.ConfigManager.Cli.Tests -c Release --no-build" /dev/null

      - name: DemoViewer.NET plugin tests
        run: dotnet run --project test/CS2OpenDev.ConfigManager.DemoViewer.Tests -c Release --no-build

      # Native AOT needs the platform linker: the MSVC tools on windows-latest, found through vswhere.exe,
      # and clang on ubuntu-latest.
      - name: Put vswhere on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/Program Files (x86)/Microsoft Visual Studio/Installer" >> "$GITHUB_PATH"

      - name: Publish acb (Native AOT)
        shell: bash
        run: dotnet publish src/CS2OpenDev.ConfigManager.Cli -c Release -r ${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }}

      # The administrator's run starts this binary from wherever it sits, so the DLLs it imports must come from
      # System32 only, never from a file put beside it (the linker's dependent load flag, read back from the image).
      - name: Check acb.exe loads its DLLs only from System32
        if: runner.os == 'Windows'
        shell: bash
        run: python .github/scripts/pe-load-flags.py artifacts/publish/CS2OpenDev.ConfigManager.Cli/release_win-x64/acb.exe

      # The suites run under the JIT; this runs the binary that ships (AOT, trimmed, invariant globalization,
      # asInvoker manifest) end to end against fake Steam folders and an undo store in temp. Windows runners run
      # jobs as an administrator, so there it checks that acb writes nothing through the Steam folder; the restore
      # and undo legs run on Linux.
      - name: Smoke-test the published acb
        shell: bash
        run: |
          rid=${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }}
          exe=${{ runner.os == 'Windows' && 'acb.exe' || 'acb' }}
          bash .github/scripts/acb-smoke.sh "artifacts/publish/CS2OpenDev.ConfigManager.Cli/release_$rid/$exe"

      - name: Keep the published acb for the system tests
        uses: actions/upload-artifact@v4
        with:
          name: acb-${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }}
          path: artifacts/publish/CS2OpenDev.ConfigManager.Cli/release_${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }}/${{ runner.os == 'Windows' && 'acb.exe' || 'acb' }}
          if-no-files-found: error

  # A Linux player PC: a non-root user, Steam under ~/.local/share/Steam with ~/.steam/steam linked to it, the
  # default undo store. test/system/linux/scenarios.sh says what it checks.
  linux-pc:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acb-linux-x64
          path: context
      - name: Run the Linux player PC
        run: |
          cp test/system/fixture/make-fake-steam.sh test/system/linux/scenarios.sh context/
          docker build -t acb-linux-pc -f test/system/linux/Dockerfile context
          docker run --rm acb-linux-pc

  # A Windows player PC: Server Core, process isolation (the image's build matches windows-2022's), a standard user
  # and ContainerAdministrator. test/system/windows/scenarios.ps1 says what it asserts and what it only reports.
  # windows-2022, as the windows-2025 image has no Docker engine.
  windows-pc:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acb-win-x64
          path: context
      - name: Run the Windows player PC
        shell: pwsh
        run: |
          Copy-Item test/system/fixture/New-FakeSteam.ps1, test/system/windows/scenarios.ps1 context/
          docker build -t acb-windows-pc -f test/system/windows/Dockerfile context
          docker run --rm --isolation=process --user player acb-windows-pc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker run --rm --isolation=process acb-windows-pc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The runner VM itself: real registry, real powercfg. Disposable, so the machine-wide sections are restored and
  # undone for real; slower and heavier than the containers, so not on every pull request.
  windows-vm:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    env:
      ACB_DISPOSABLE_MACHINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acb-win-x64
          path: acb
      - name: Restore and undo on the runner
        shell: pwsh
        run: ./test/system/windows-vm/scenarios.ps1 -Acb acb/acb.exe -Fixture test/system/fixture/New-FakeSteam.ps1
