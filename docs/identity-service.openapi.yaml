openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base

info:
  title: CS2OpenDev identity signing for acb
  version: 1.0.0
  summary: What the CS2OpenDev service implements so acb can sign a backup for a Steam account.
  description: |
    The contract between `acb` (Advanced Config Backup) and the CS2OpenDev service for the `identity` trust level.
    `docs/identity-service.md` explains the reasons; this file is the part both sides are built and tested against.

    ## Signing in

    The service does not talk to Steam. Its OpenID Connect provider brokers Steam's OpenID 2.0 login, and the
    `sign` operation accepts only that provider's access tokens, with the player's SteamID64 in a claim the service
    trusts.

    `acb` signs only through the service whose address is compiled into it, and signs in only at that
    service's issuer, also compiled in, so a token from the real provider is never sent to another service. No
    other service is taken, not even one on the PC's loopback address: its sign-in page could send the browser on
    to the real provider with `acb`'s own redirect, state and challenge, and swap the code that comes back for a
    real token. Tests compile their stand-in in instead. `acb` is a public client (no secret):

    1. `GET /v1/acb/config` names the provider (`issuer`), the client id and the scope. `issuer` must be
       exactly the issuer `acb` knows.
    2. `acb` reads `{issuer}/.well-known/openid-configuration`. Its `issuer` must equal the configured one
       (OpenID Connect Discovery 1.0, section 4.3), and `authorization_endpoint` and `token_endpoint` must be
       on the issuer's own scheme, host and port. Otherwise `acb` stops before opening or sending anything.
    3. It opens the browser at the authorization endpoint with `response_type=code`, `client_id`, `scope`,
       `state`, `code_challenge`, `code_challenge_method=S256` and `redirect_uri=http://127.0.0.1:{port}/callback`,
       on a port it picked. The provider's client must accept a loopback redirect on any port (RFC 8252, 7.3) and
       must require PKCE with S256.
    4. The provider sends the browser back to that address with `code` and `state`, or with `error`.
    5. `acb` posts `grant_type=authorization_code`, `code`, `redirect_uri`, `client_id` and `code_verifier` to the
       token endpoint, form-encoded, and reads `access_token` from the JSON answer. It keeps the token in memory for
       that run only, and sends no refresh token.

    Steps 2 to 5 are the provider's standard endpoints, so they are not operations here.

    ## Errors

    `acb` reports the HTTP status of any non-2xx answer and writes no backup; it does not read the body. The
    service should still answer with `application/problem+json` (RFC 9457) for its own logs and other clients.
    An answer that is not JSON, or lacks a member its schema requires, or has it null, is a failed step too.

    ## Strictness

    `acb` reads the signing answer strictly: an unknown member anywhere in the envelope, the statement, the
    predicate or the delegation makes it refuse the answer. Every schema below that says
    `additionalProperties: false` means exactly that. Before writing the backup `acb` checks the envelope as any
    reader would (see `IdentityEnvelope`); a signature that does not check is a failed signing.
    That check is one public function, `Identity.CheckEnvelope` in `CS2OpenDev.ConfigManager.Core`, which takes the
    signature file, the manifest's digest, the trust and the time; the service's tests run it on its own answers
    against test roots made with `CS2OpenDev.ConfigManager.IdentityIssuer`.

    Base64 throughout is standard base64 with padding (RFC 4648, section 4), not base64url.

    The examples have the right shapes and sizes, but their keys and signatures are made up and do not verify.
  license:
    name: See the repository
    identifier: LicenseRef-CS2OpenDev

servers:
  - url: '{service}'
    description: |
      The service's base address, compiled into `acb` (https, no user info, no query). `--identity-service` and
      `ACB_IDENTITY_SERVICE` are refused unless they name that same address.
    variables:
      service:
        default: https://api.cs2opendev.dev

tags:
  - name: acb
    description: Signing backups made by acb.

paths:
  /v1/acb/config:
    get:
      tags: [acb]
      operationId: getAcbConfig
      summary: Where acb signs in
      description: |
        Needs no authentication. `acb` calls it once per run, the first time it signs. Members `acb` does not
        know are ignored here, so the service may add some.
      security: []
      responses:
        '200':
          description: The identity provider and the client acb signs in as.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcbConfig'
              example:
                issuer: https://login.cs2opendev.dev/realms/cs2opendev
                clientId: acb
                scope: openid
        '5XX':
          $ref: '#/components/responses/Unavailable'

  /v1/acb/sign:
    post:
      tags: [acb]
      operationId: signManifest
      summary: Sign a backup's manifest for the signed-in Steam account
      description: |
        The service:

        1. takes the SteamID64 from the access token, never from the request;
        2. builds the statement (`Statement`) for `manifestSha256`, with `signedAt` from its own clock in UTC and
           the delegation that lists the key it signs with, unchanged;
        3. signs it with its current signing key, held in an HSM or key vault and never exported;
        4. appends `(steamId64, manifestSha256, platform, tool, signedAt, keyid)` to its append-only log, and
           answers only once that is stored. An entry is kept until its key's `notAfter` plus one year and then
           deleted; it is read only for incident response. Client addresses serve rate limiting only and are
           not written with entries (docs/identity-service.md, "The log");
        5. answers `200` with the envelope.

        The settings themselves are never sent. `platform` and `tool` are for the log; they are not in the
        statement.

        Signing the same manifest twice is allowed and gives two log entries and two envelopes.
      security:
        - steamAccount: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignRequest'
            example:
              manifestSha256: 3b9f0c6d2a1e4f5b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b
              platform: windows-x64
              tool:
                name: Advanced Config Backup (acb)
                version: 0.7.0
      responses:
        '200':
          description: The signed statement. `acb` checks it before writing the backup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityEnvelope'
              example:
                payloadType: application/vnd.in-toto+json
                payload: 
                signatures:
                  - keyid: c80b80de18812bd1ea3c6bfe6a0179f4202d6857125d2e1ab71dc64657397c84
                    sig: LB7mg3IhWxzgZEJrXNvU7yWBrODdOyH6K+J/NkgnJC6D9otovgP1s+JL5dG0MV+YoKltGXE/s6GdxFX7atw0MQ==
        '400':
          description: The request is not a `SignRequest` (a member missing or unknown, a bad digest or platform).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No access token, or one that is invalid or expired. `acb` signs in again on its next run.
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: '`Bearer`, with `error="invalid_token"` when a token was sent (RFC 6750).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The token is valid but carries no SteamID64, or the account may not sign.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: The body is larger than the service accepts (a valid request is well under 1 KiB).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many signatures for this account or address; try later. `acb` tells the person when, from `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '5XX':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    steamAccount:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An access token from the identity provider named by `GET /v1/acb/config`, issued to the `acb` client by the
        authorization code flow with PKCE. The service checks its signature, issuer, audience and expiry, and
        reads the SteamID64 from the claim the provider sets from the brokered Steam login. Binding the token to
        the client (DPoP, RFC 9449) is not decided yet (docs/identity-service.md, "Not decided").

  responses:
    Unavailable:
      description: |
        The service cannot answer, or cannot sign: the key vault or the log is unreachable. It must not sign
        without logging.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    AcbConfig:
      type: object
      required: [issuer, clientId, scope]
      properties:
        issuer:
          type: string
          format: uri
          description: |
            The OpenID Connect issuer. `acb` appends `/.well-known/openid-configuration` to it, without a
            trailing slash. It must be exactly the issuer compiled into `acb`, and the discovery document's
            `issuer` must equal it.
          pattern: '^https://'
        clientId:
          type: string
          minLength: 1
          description: The public client `acb` signs in as.
        scope:
          type: string
          minLength: 1
          description: The scope `acb` asks for, space-separated, sent unchanged.

    SignRequest:
      type: object
      additionalProperties: false
      required: [manifestSha256, platform, tool]
      properties:
        manifestSha256:
          $ref: '#/components/schemas/Sha256Hex'
        platform:
          $ref: '#/components/schemas/Platform'
        tool:
          $ref: '#/components/schemas/Tool'

    Tool:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          examples: [Advanced Config Backup (acb)]
        version:
          type: string
          minLength: 1
          maxLength: 64
          description: The release's version, without build metadata.
          examples: [0.7.0, 0.1.0-alpha]

    Platform:
      type: string
      enum: [windows-x64, linux-x64]
      description: The platform the backup restores on.

    Sha256Hex:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: A SHA-256 digest in lowercase hex.

    KeyId:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: A key's id, the SHA-256 of its SubjectPublicKeyInfo DER, in lowercase hex.

    SteamId64:
      type: string
      pattern: '^[0-9]{17}$'
      description: |
        An individual Steam account's 64-bit id, in decimal. `acb` also requires it to be above 76561197960265728
        and below 76561197960265728 + 4294967295.
      examples: ['76561198000000000']

    Base64:
      type: string
      contentEncoding: base64
      pattern: '^[A-Za-z0-9+/]*={0,2}$'

    DsseSignature:
      type: object
      additionalProperties: false
      required: [keyid, sig]
      properties:
        keyid:
          $ref: '#/components/schemas/KeyId'
        sig:
          allOf:
            - $ref: '#/components/schemas/Base64'
          description: |
            ECDSA P-256 over SHA-256, in IEEE P1363 form (r then s, 32 bytes each, 64 bytes in all; not DER), over
            DSSE's pre-authentication encoding: `"DSSEv1" SP len(payloadType) SP payloadType SP len(payload) SP
            payload`, with lengths as ASCII decimal byte counts and `payload` the decoded bytes.

    IdentityEnvelope:
      type: object
      additionalProperties: false
      required: [payloadType, payload, signatures]
      description: |
        A DSSE envelope over the statement, signed once by the service with ECDSA P-256. It may carry up to four
        signatures: exactly one must be by a P-256 key the delegation lists, and any other (by a key the delegation
        does not list, or does not list as P-256, such as a post-quantum signature added later) is not checked and
        never makes a backup check. `acb` refuses it unless:

        - `payloadType` and the statement's `_type` and `predicateType` are the values below;
        - the statement's only subject is `manifest.json` with the digest that was sent;
        - the delegation is signed by at least two of the root keys built into `acb`;
        - exactly one signature's `keyid` is a P-256 key the delegation lists, and `signedAt` is in that key's window
          (`notBefore` <= `signedAt` < `notAfter`) and before the delegation's `revokedFrom` for it, if any;
        - that key is not among the stolen keys `acb` ships, which count for no signature whatever `signedAt` says,
          since the signer writes it;
        - the key's `spki` is a P-256 SubjectPublicKeyInfo (named curve prime256v1, uncompressed point), byte for
          byte;
        - `signedAt` is no more than one hour ahead of the PC's clock;
        - the signature checks.
      properties:
        payloadType:
          const: application/vnd.in-toto+json
        payload:
          type: string
          contentEncoding: base64
          contentMediaType: application/vnd.in-toto+json
          contentSchema:
            $ref: '#/components/schemas/Statement'
        signatures:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/DsseSignature'

    Statement:
      type: object
      additionalProperties: false
      required: [_type, subject, predicateType, predicate]
      description: An in-toto v1 statement naming the backup's manifest.
      properties:
        _type:
          const: https://in-toto.io/Statement/v1
        subject:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name, digest]
            properties:
              name:
                const: manifest.json
              digest:
                type: object
                additionalProperties: false
                required: [sha256]
                properties:
                  sha256:
                    $ref: '#/components/schemas/Sha256Hex'
        predicateType:
          const: https://cs2opendev.dev/acb/trust/v1
        predicate:
          $ref: '#/components/schemas/IdentityPredicate'
      examples:
        - _type: https://in-toto.io/Statement/v1
          subject:
            - name: manifest.json
              digest:
                sha256: 3b9f0c6d2a1e4f5b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b
          predicateType: https://cs2opendev.dev/acb/trust/v1
          predicate:
            level: identity
            steamId64: '76561198000000000'
            signedAt: '2026-11-02T23:30:00+00:00'
            delegation:
              payloadType: application/vnd.cs2opendev.acb-delegation+json
              payload: 
              signatures:
                - keyid: d0b6b951d313294318002dfa2c33f529a0d58113d36dc35e0a83bb1e0f8638ec
                  sig: 1fbnuTXEcZcqO/lnbPAUBRgOJPrarrmq0dC7EGjSvg7YtzFeekxBY4qC+EryQKTfzEkFqAyQHq78e97xnty6mw==
                - keyid: a7bc10190b9ab97f8c503398e5cd38c4870a5ba0e222951a0c7a107cd34a0c2b
                  sig: NKrReE/OcrkHVguaEMcWuE1on4iuqsGuczXBFq/iPL1f/MLIgW8Xj8suRpjQSIPzOToCGSonA/sYzaImUOngtA==

    IdentityPredicate:
      type: object
      additionalProperties: false
      required: [level, steamId64, signedAt, delegation]
      description: |
        The identity level's predicate. It has no `kdf`: that member belongs to the seal level, and `acb` refuses
        an identity predicate that carries one.
      properties:
        level:
          const: identity
        steamId64:
          $ref: '#/components/schemas/SteamId64'
        signedAt:
          type: string
          format: date-time
          description: When the service signed, by its own clock, in UTC (RFC 3339).
        delegation:
          $ref: '#/components/schemas/DelegationEnvelope'

    DelegationEnvelope:
      type: object
      additionalProperties: false
      required: [payloadType, payload, signatures]
      description: |
        The current delegation exactly as the root holders signed it at the key ceremony. The service stores it
        and copies it in; it never builds or re-signs one. A signature by a root `acb` does not know is skipped, not
        refused.
      properties:
        payloadType:
          const: application/vnd.cs2opendev.acb-delegation+json
        payload:
          type: string
          contentEncoding: base64
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/Delegation'
        signatures:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/DsseSignature'

    Delegation:
      type: object
      additionalProperties: false
      required: [_type, version, issued, keys]
      description: |
        The service's signing keys, as the root keys vouch for them. `version` orders delegations for the
        ceremony and the service (each new one is higher); `acb` checks a backup against the delegation it
        carries and does not compare versions. A key revoked here therefore binds only backups signed under this
        delegation, and only an honest signer; a stolen key is stopped by the revocation list each `acb` release
        ships, which voids every signature the key made, but only in the `acb` that ships it. Every root holder
        whose key is still in use signs each delegation, so a root replaced later still leaves it at the threshold,
        and the release that removes a root pins every earlier delegation by the SHA-256 of its payload, so it
        checks without the removed root.
      properties:
        _type:
          const: https://cs2opendev.dev/acb/delegation/v1
        version:
          type: integer
          minimum: 1
        issued:
          type: string
          format: date-time
        keys:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DelegatedKey'

    DelegatedKey:
      type: object
      additionalProperties: false
      required: [keyid, spki, notBefore, notAfter]
      properties:
        keyid:
          $ref: '#/components/schemas/KeyId'
        spki:
          allOf:
            - $ref: '#/components/schemas/Base64'
          description: >-
            The P-256 public key as SubjectPublicKeyInfo DER, base64: the named curve prime256v1 and an
            uncompressed point, 91 bytes. Its SHA-256 must equal `keyid`.
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
          description: Exclusive.
        revokedFrom:
          type: string
          format: date-time
          description: >-
            Present once the service stopped using the key; a signature dated at or after it does not count. The
            signer writes that date, so this binds only an honest signer.

    Problem:
      type: object
      description: RFC 9457 problem details. `acb` does not read it.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
